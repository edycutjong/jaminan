[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["node_modules", ".next", ".venv", ".vercel"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E741", "E701", "E702", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "B011"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
files = ["jaminan", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
