name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API · lint, types, tests, audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check --output-format=github .
      - name: Types (mypy)
        run: mypy
      # The real-sandbox, live-Qwen and headless-browser tests need credentials and are run by hand
      # (see README); this is the offline suite: unit, contract, state-machine and the 15,360-case claim-decision sweep.
      - name: Tests + coverage (offline)
        run: pytest -m "not sandbox and not live_model and not slow" --cov=jaminan --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: coverage.xml
          retention-days: 7
      - name: Dependency audit (pip-audit)
        run: pip-audit --progress-spinner off
      - name: API smoke (uvicorn boots, health + tariff answer)
        run: |
          uvicorn api.index:app --port 8011 &
          for i in $(seq 1 20); do curl -sf localhost:8011/api/health && break || sleep 1; done
          curl -sf localhost:8011/api/health | grep -q '"ok":true'
          curl -sf localhost:8011/api/shops/shop-demo | grep -q tariff

  web:
    name: Web · lint, types, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Dependency audit (npm audit, high+)
        run: npm audit --audit-level=high
